<title>Sauberlich System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Sora:wght@600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@600;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: palco escuro com profundidade (hero com pilha 3D de telas reais), vitrine, "por dentro", planos e editor tipo Wix (arrastar blocos, editar textos no lugar). Todas as cores vêm de tokens; modo claro/escuro editável. */
:root{
  --c1:#9a8cff;--c2:#ff7a90;--c3:#2ee59d;--radius:26px;--hfont:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --bg:#070914;--bg2:#0d1124;--ink:#eef1ff;--mute:#9aa3c7;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--card:rgba(255,255,255,.05);--onc:#0a0d1f;--nav:rgba(13,17,36,.62);
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ed:#12162b;--edline:rgba(255,255,255,.1);
  color-scheme:dark;
}
body[data-mode=light]{--bg:#f4f5fb;--bg2:#fff;--ink:#12142a;--mute:#5a6188;--line:rgba(18,20,42,.12);--glass:rgba(18,20,42,.045);--glass2:rgba(18,20,42,.09);--card:#fff;--onc:#fff;--nav:rgba(255,255,255,.75)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);margin:0;overflow-x:hidden;position:relative;transition:background .4s}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60vmax 40vmax at 15% 8%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 60%),radial-gradient(50vmax 40vmax at 92% 30%,color-mix(in srgb,var(--c2) 16%,transparent),transparent 60%),radial-gradient(50vmax 40vmax at 40% 100%,color-mix(in srgb,var(--c3) 14%,transparent),transparent 60%)}
h1,h2,h3,h4{font-family:var(--hfont);line-height:1.06;text-wrap:balance;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--c1);outline-offset:3px;border-radius:8px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

#stagewrap{position:relative;z-index:1;transition:margin .3s}
#site{container-type:inline-size;max-width:100%;margin-inline:auto;transition:max-width .35s;padding-inline:16px;position:relative}
#site.tablet{max-width:820px} #site.mobile{max-width:400px}
.in{max-width:1180px;margin-inline:auto}
.blk{position:relative}
.sec{padding-block:88px}
.sec.hero{padding-block:56px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;font-family:var(--body);transition:transform .25s,box-shadow .25s;color:var(--ink)}
.btn.pri{background:linear-gradient(120deg,var(--ink),color-mix(in srgb,var(--ink) 80%,var(--c1)));color:var(--bg);box-shadow:0 8px 30px color-mix(in srgb,var(--c1) 40%,transparent)}
.btn.pri:hover{transform:translateY(-2px) scale(1.03)}
.btn.gh{background:var(--glass);border-color:var(--line)} .btn.gh:hover{background:var(--glass2);transform:translateY(-2px)}
.btn.sm{padding:9px 18px;font-size:14px}

/* nav */
.nav{position:sticky;top:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 12px 10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--nav);backdrop-filter:blur(16px);max-width:1180px;margin-inline:auto}
.logo{font:800 19px var(--hfont);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 200deg,var(--c2),#ffb938,var(--c3),#4cc2ff,var(--c1),var(--c2));transform:rotate(12deg);box-shadow:0 0 18px color-mix(in srgb,var(--c1) 60%,transparent);flex:none}
.nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.nav ul a{padding:8px 14px;border-radius:999px;color:var(--mute);font-size:14px;font-weight:500;transition:.25s;display:block}
.nav ul a:hover{color:var(--ink);background:var(--glass2)}

/* hero */
.hero .in{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(38px,6cqw,82px);font-weight:800;letter-spacing:-.035em;margin-block:16px 20px}
.grad{background:linear-gradient(100deg,var(--c2),#ffb938 35%,var(--c3) 65%,var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.lead{font-size:clamp(16px,1.7cqw,20px);color:var(--mute);max-width:52ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.trust b{display:block;font:800 28px var(--hfont)} .trust span{font-size:13px;color:var(--mute)}
.stage{perspective:1500px;height:min(520px,60cqw);min-height:340px;position:relative;min-width:0}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .18s ease-out}
.pane{position:absolute;width:62%;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 70px rgba(0,0,0,.45);background:#fff;animation:bob 7s ease-in-out infinite;transform-style:preserve-3d}
@keyframes bob{50%{translate:0 -12px}}
.pane:nth-child(1){left:0;top:4%;transform:translateZ(30px) rotateY(14deg) rotateZ(-3deg)}
.pane:nth-child(2){right:0;top:0;transform:translateZ(110px) rotateY(-10deg) rotateZ(2deg);animation-delay:-2s}
.pane:nth-child(3){left:6%;bottom:2%;transform:translateZ(190px) rotateY(10deg) rotateZ(2deg);animation-delay:-4s}
.pane:nth-child(4){right:3%;bottom:6%;transform:translateZ(80px) rotateY(-12deg) rotateZ(-3deg);animation-delay:-5s}
.orb{position:absolute;left:50%;top:48%;width:36%;aspect-ratio:1;margin:-18% 0 0 -18%;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,var(--c1) 30%,color-mix(in srgb,var(--c1) 25%,#000) 72%);box-shadow:0 0 100px color-mix(in srgb,var(--c1) 70%,transparent);transform:translateZ(-90px);animation:bob 9s ease-in-out infinite}
.chrome{display:flex;gap:5px;align-items:center;padding:7px 10px;background:#eef0f6}
.chrome i{width:8px;height:8px;border-radius:50%;background:#ff6b6b}.chrome i:nth-child(2){background:#ffd166}.chrome i:nth-child(3){background:#06d6a0}
.shot{container-type:inline-size;aspect-ratio:1.6;background:#fff;position:relative;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

.marq{overflow:hidden;border-block:1px solid var(--line);padding:16px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marq div{display:flex;gap:56px;width:max-content;animation:mq 34s linear infinite;font:700 21px var(--hfont);color:var(--mute)}
.marq span{display:flex;align-items:center;gap:56px;white-space:nowrap}.marq span:after{content:"✦";color:var(--c1)}
@keyframes mq{to{transform:translateX(-50%)}}

.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.head h2,.t2{font-size:clamp(30px,4.4cqw,56px);font-weight:800;letter-spacing:-.03em;margin-top:10px;max-width:17ch}
.head p{max-width:44ch;color:var(--mute);margin:0}

/* vitrine */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;perspective:1300px}
.card{position:relative;min-width:0;border-radius:var(--radius);padding:18px 18px 22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass2),var(--glass));transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .3s;overflow:hidden;--c:var(--c1)}
.card:hover{box-shadow:0 30px 70px rgba(0,0,0,.35),0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 28%,transparent),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.card:hover:before{opacity:1}
.card .thumb{border-radius:calc(var(--radius) - 10px);overflow:hidden;border:1px solid var(--line);transform:translateZ(40px);box-shadow:0 18px 40px rgba(0,0,0,.3);cursor:pointer}
.card .ci{display:flex;align-items:center;gap:12px;margin:20px 6px 8px;transform:translateZ(34px)}
.card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#0a0d1f;font:800 20px var(--hfont);flex:none;box-shadow:0 10px 26px color-mix(in srgb,var(--c) 50%,transparent)}
.card h3{font-size:26px;font-weight:800;letter-spacing:-.02em}
.card p{color:var(--mute);margin:0 6px 14px;font-size:15px;transform:translateZ(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 6px 18px;transform:translateZ(24px)}
.chips span{font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 6px;transform:translateZ(28px)}
.from{font-size:14px;color:var(--mute)}.from b{font:800 22px var(--hfont);color:var(--ink)}
.link{font-weight:600;font-size:14px;color:var(--c);cursor:pointer}

/* por dentro */
.inside .in{display:grid;grid-template-columns:.8fr 1.4fr;gap:34px;align-items:center}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.tab{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--mute);cursor:pointer;font:600 14px var(--body);transition:.25s;display:flex;align-items:center;gap:8px}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab[aria-selected=true]{color:#0a0d1f;background:var(--c);border-color:transparent;box-shadow:0 8px 24px color-mix(in srgb,var(--c) 50%,transparent)}
.tab[aria-selected=true] i{background:#0a0d1f}
.feat{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
.feat li{display:flex;gap:10px;color:var(--mute)}.feat li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:9px;flex:none;box-shadow:0 0 12px var(--c)}
.big{perspective:1600px;min-width:0}
.bigf{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 50px 90px rgba(0,0,0,.45),0 0 80px color-mix(in srgb,var(--c) 22%,transparent);transition:transform .2s ease-out;transform:rotateY(-8deg) rotateX(3deg);background:#fff}
.sw2{display:flex;gap:10px;margin-top:20px;justify-content:center}
.sw2 button{width:92px;aspect-ratio:1.6;border-radius:10px;overflow:hidden;border:2px solid var(--line);padding:0;cursor:pointer;background:#fff;opacity:.6;transition:.25s}
.sw2 button[aria-pressed=true]{opacity:1;border-color:var(--c);transform:translateY(-4px)}
.sw2 .shot{pointer-events:none}

/* planos */
.sim{border:1px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:clamp(18px,3cqw,40px);background:linear-gradient(180deg,var(--glass2),var(--glass))}
.bill{display:flex;align-items:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.swt{position:relative;width:58px;height:32px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);cursor:pointer;padding:0}
.swt i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:.3s cubic-bezier(.5,1.6,.5,1)}
.swt[aria-pressed=true] i{left:29px;background:var(--c)}
.save{font:500 12px var(--mono);color:#0a0d1f;background:var(--c3);padding:4px 10px;border-radius:99px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;perspective:1000px}
.plan{min-width:0;border-radius:calc(var(--radius) - 2px);padding:26px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:14px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;position:relative}
.plan:hover{transform:translateY(-8px) rotateX(3deg)}
.plan.hot{border-color:var(--c);background:linear-gradient(170deg,color-mix(in srgb,var(--c) 22%,var(--bg2)),var(--bg2));box-shadow:0 20px 60px color-mix(in srgb,var(--c) 28%,transparent)}
.plan .tag{position:absolute;top:-12px;right:20px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:#0a0d1f;padding:5px 12px;border-radius:99px}
.plan h4{font:700 20px var(--hfont)}
.price{font:800 44px/1 var(--hfont);letter-spacing:-.03em;font-variant-numeric:tabular-nums}.price small{font:500 15px var(--body);color:var(--mute);letter-spacing:0}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14.5px;flex:1}
.plan li{display:flex;gap:10px}.plan li:before{content:"✓";color:var(--c);font-weight:700}
.plan li.no{color:var(--mute);text-decoration:line-through;opacity:.6}.plan li.no:before{content:"–";color:var(--mute)}
.rules{margin-top:26px;padding:20px 22px;border-radius:20px;background:var(--glass);border:1px dashed var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rules b{display:block;font:700 15px var(--hfont);margin-bottom:2px}.rules span{font-size:13.5px;color:var(--mute)}
.note{margin:14px 0 0;font-size:13px;color:var(--mute)}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{padding:24px;border-radius:calc(var(--radius) - 4px);border:1px solid var(--line);background:var(--glass);min-width:0;transition:transform .3s}.step:hover{transform:translateY(-6px)}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--bg);font:800 17px var(--hfont);margin-bottom:16px}
.step h3{font-size:20px;margin-bottom:6px}.step p{margin:0;color:var(--mute);font-size:14.5px}
.final{text-align:center;padding:64px 24px;border-radius:calc(var(--radius) + 10px);border:1px solid var(--line);background:radial-gradient(70% 120% at 50% 0%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 70%),var(--bg2)}
.final h2{font-size:clamp(30px,5cqw,60px);font-weight:800;letter-spacing:-.03em;max-width:17ch;margin:12px auto 22px}.final .cta{justify-content:center}
.txt{max-width:760px;margin-inline:auto}.txt p{color:var(--mute);font-size:18px;margin:16px 0 0}
.imgb figure{margin:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.3)}.imgb img,.imgb .ph{width:100%;aspect-ratio:16/7;object-fit:cover;display:block}
.imgb .ph{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));display:grid;place-items:center;color:#fff;font:700 18px var(--hfont)}
.imgb figcaption{padding:12px 18px;color:var(--mute);font-size:14px;background:var(--glass)}
.faq{max-width:800px;margin-inline:auto;display:grid;gap:10px}
.faq details{border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:16px 20px}.faq summary{cursor:pointer;font:700 17px var(--hfont)}.faq p{color:var(--mute);margin:10px 0 0}
footer.f{padding-block:40px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--mute);font-size:14px;border-top:1px solid var(--line);max-width:1180px;margin:40px auto 0}
.admin-link{cursor:pointer;color:var(--mute);background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:500 13px var(--body)}.admin-link:hover{color:var(--ink);background:var(--glass)}

.rv{opacity:.3;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;transform:none}

@container (max-width:980px){
  .hero .in,.inside .in{grid-template-columns:1fr}.plans,.steps,.rules{grid-template-columns:1fr 1fr}.nav ul{display:none}.stage{height:60cqw}
}
@container (max-width:640px){
  .sec{padding-block:60px}.grid,.plans,.steps,.rules{grid-template-columns:1fr}.pane:nth-child(4){display:none}.stage{height:78cqw;min-height:260px}.sim{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ===== telas recriadas (Chamados, WhatsAtendente): tudo em em, escala com o contêiner ===== */
.scr{font:400 1.5cqw/1.35 'DM Sans',system-ui,sans-serif;position:absolute;inset:0;color:#1d2140;background:#f5f6fb;display:grid}
.scr *{box-sizing:border-box}
.scr.cham{grid-template-columns:15.5em 1fr}
.scr .sb{background:#fff;border-right:.1em solid #e5e7f1;padding:1.4em 1em;display:flex;flex-direction:column;gap:.3em}
.scr .lg{display:flex;align-items:center;gap:.6em;font-weight:700;font-size:1.15em;margin-bottom:1.2em}.scr .lg i{width:1.8em;height:1.8em;border-radius:.55em;background:#6d5efc;display:block}
.scr .sb a{padding:.65em .8em;border-radius:.6em;color:#5a6088;font-weight:500}.scr .sb a.on{background:#ece9ff;color:#4a3bd6;font-weight:700}
.scr .mn{padding:1.4em 1.8em;display:flex;flex-direction:column;gap:1.1em;min-width:0}
.scr .tp{display:flex;justify-content:space-between;align-items:center}.scr .tp b{font-size:1.9em;letter-spacing:-.02em}
.scr .bt{background:#6d5efc;color:#fff;padding:.6em 1.1em;border-radius:.6em;font-weight:600}
.scr .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em}.scr .kp div{background:#fff;border-radius:.9em;padding:.8em 1em;border:.1em solid #e8eaf3}
.scr .kp small{display:block;color:#7a80a5;font-size:.82em}.scr .kp b{font-size:1.9em}
.scr table{width:100%;border-collapse:collapse;background:#fff;border-radius:.9em;overflow:hidden;border:.1em solid #e8eaf3;font-size:.95em}
.scr th{text-align:left;color:#7a80a5;font-weight:600;font-size:.82em;padding:.7em 1em;background:#fafbff}.scr td{padding:.72em 1em;border-top:.1em solid #eef0f7}
.scr .pl{padding:.2em .65em;border-radius:99px;font-size:.82em;font-weight:600}.pl.r{background:#ffe3e3;color:#c92a2a}.pl.y{background:#fff1cf;color:#a66a00}.pl.g{background:#d9f7e6;color:#1b7f4b}.pl.b{background:#e0ecff;color:#1c5fd1}
.scr.wa{grid-template-columns:4.4em 22em 1fr;background:#efeae2}
.scr .rl{background:#0f3d33;display:flex;flex-direction:column;align-items:center;gap:1.1em;padding:1.2em 0}.scr .rl i{width:2.2em;height:2.2em;border-radius:.7em;background:rgba(255,255,255,.14);display:block}.scr .rl i:first-child{background:#25d366}
.scr .ql{background:#fff;border-right:.1em solid #e5e7ea;display:flex;flex-direction:column}
.scr .ql h5{margin:0;padding:1.1em 1.2em;font-size:1.25em;font-weight:700;border-bottom:.1em solid #eceef0}
.scr .qi{display:flex;gap:.8em;padding:.85em 1.2em;border-bottom:.1em solid #f1f2f4;align-items:center}.scr .qi.on{background:#e8f8ef}
.scr .av{width:2.6em;height:2.6em;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}.scr .qi div{min-width:0;flex:1}.scr .qi b{display:block}.scr .qi small{color:#7a8186;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr .ac{background:#25d366;color:#fff;font-weight:700;font-size:.8em;padding:.45em .8em;border-radius:.5em}
.scr .ch{display:flex;flex-direction:column;min-width:0}.scr .ch .hd{background:#f0f2f5;padding:.9em 1.4em;display:flex;gap:.8em;align-items:center;border-bottom:.1em solid #e1e4e8}
.scr .msgs{flex:1;padding:1.2em 2em;display:flex;flex-direction:column;gap:.6em;justify-content:flex-end}
.scr .mg{max-width:62%;padding:.6em .9em;border-radius:.7em;background:#fff;box-shadow:0 .05em .1em rgba(0,0,0,.12)}.scr .mg.me{align-self:flex-end;background:#d9fdd3}.scr .mg small{display:block;text-align:right;color:#8a9096;font-size:.7em;margin-top:.2em}
.scr .inp{margin:.9em 1.4em;background:#fff;border-radius:2em;padding:.7em 1.2em;color:#9aa0a6}


.mbar{display:flex;gap:6px;justify-content:center;margin-bottom:18px;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px;width:fit-content;margin-inline:auto}
.mbar button{border:0;background:none;color:var(--mute);padding:9px 18px;border-radius:99px;font:600 14px var(--body);cursor:pointer;transition:.25s}
.mbar button[aria-pressed=true]{background:var(--c);color:#0a0d1f;box-shadow:0 6px 20px color-mix(in srgb,var(--c) 50%,transparent)}

 <div class="r">${s.n<3?L.map((x,i)=>`<div class="ls ${i<s.n?'ok':''}"><i>${i<s.n?'✓':i+1}</i><span style="flex:1">${x}</span>${i===s.n?'<button class="sbtn" style="background:#7c3aed;color:#fff;padding:6px 12px" data-sim="trein-les">Concluir aula</button>':''}</div>`).join(''):s.n<5?`<h5>Avaliação final</h5><p style="margin:0">Você recebeu um e-mail pedindo sua senha com urgência. O que fazer?</p>${['Responder com a senha','Clicar no link para conferir','Reportar ao time de segurança'].map((o,i)=>`<button class="opt" data-sim="trein-ans" data-o="${i}">${o}</button>`).join('')}${s.ans!=null?'<p style="color:#c92a2a;margin:8px 0 0">Resposta incorreta. Tente novamente.</p>':''}`:`<div class="cert"><small>CERTIFICADO DE CONCLUSÃO</small><p style="margin:8px 0 2px">Certificamos que</p><b>${esc(s.name)}</b><p style="margin:8px 0 2px">concluiu com aprovação o curso</p><b style="font-size:15px">Segurança da Informação</b><p style="margin:10px 0 0;font:12px monospace;color:#8a7a3a">Código SS-${(s.name.length*7919+2026)%99999}</p></div><button class="sbtn d" data-sim="trein-new">Refazer</button>`}</div></div>`}
};
function renderSim(){const b=$('#simbox');if(!b)return;const p=S.projects[curP];const f=SIMS[p&&p.id];b.innerHTML=f?f():'<div class="empty" style="min-height:300px;color:var(--mute)">O simulador deste sistema ainda não foi criado.</div>'}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-sim]');if(!a||edit)return;const k=a.dataset.sim,s=SS;
  if(k==='pesq-vote'){s.pesq.c[+a.dataset.v]++;s.pesq.v=+a.dataset.v}
  if(k==='pesq-new')s.pesq.v=null;
  if(k==='cham-new'){const v=$('#sa').value.trim()||'Novo chamado de exemplo';s.cham.t.unshift({n:++s.cham.n,s:v,p:$('#sp').value,st:0})}
  if(k==='cham-adv'){const t=s.cham.t.find(x=>x.n==a.dataset.n);if(t)t.st++}
  if(k==='whats-acc')s.whats.cur=+a.dataset.id;
  if(k==='whats-send'){const i=$('#sm'),v=i.value.trim();if(!v)return;const c=s.whats.q.find(x=>x.id===s.whats.cur);c.ms.push({me:1,t:v});setTimeout(()=>{if(s.whats.cur===c.id){c.ms.push({t:'Perfeito, obrigado pela ajuda!'});if(imode==='sim')renderSim()}},1100)}
  if(k==='whats-tr'){const c=s.whats.q.find(x=>x.id===s.whats.cur);c.ms.push({sy:1,t:'Conversa transferida para o atendente Carlos'});s.whats.cur=null;toast('Conversa transferida')}
  if(k==='whats-end'){s.whats.q=s.whats.q.filter(x=>x.id!==s.whats.cur);s.whats.cur=null;s.whats.done++}
  if(k==='trein-les')s.trein.n++;
  if(k==='trein-ans'){if(+a.dataset.o===2)s.trein.n=5;else s.trein.ans=+a.dataset.o}
  if(k==='trein-new'){s.trein.n=0;s.trein.ans=null}
  const tn=$('#tn');if(tn)s.trein.name=tn.value||'Colaborador Exemplo';
  renderSim();
});
document.addEventListener('input',e=>{if(e.target.id==='tn')SS.trein.name=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='sm'&&e.key==='Enter')document.querySelector('[data-sim=whats-send]').click()});
function embedUrl(u){let m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/);if(m)return 'https://www.youtube.com/embed/'+m[1];m=u.match(/vimeo\.com\/(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1];return ''}
function videoHTML(p){
  if(p.video){const em=embedUrl(p.video);return `<div class="vid">${em?`<iframe src="${em}" allowfullscreen title="Vídeo de ${esc(p.name)}"></iframe>`:`<video src="${esc(p.video)}" controls playsinline></video>`}</div>`}
  const on=vidOn[p.id];
  if(!on)return `<div class="vid"><span class="vtag">Vídeo demonstrativo</span>${sh(p,0).replace(' imgedit','').replace(/ data-img="[^"]*"/,'')}<div class="poster" data-play="${p.id}"><span class="play">▶</span></div></div>`;
  return `<div class="vid tour"><span class="vtag">Vídeo demonstrativo · exemplo</span>${p.feats.map((f,k)=>`<div class="slide ${k===0?'on':''}">${sh(p,k%p.shots.length).replace(' imgedit','').replace(/ data-img="[^"]*"/,'')}</div>`).join('')}<div class="cap">${esc(p.feats[0])}</div><div class="pg"></div></div>`;
}
function startTour(){clearInterval(tourT);const v=$('.tour');if(!v)return;const sl=$$('.slide',v),cap=$('.cap',v),p=S.projects[curP];let i=0;tourT=setInterval(()=>{if(!document.body.contains(v)){clearInterval(tourT);return}i=(i+1)%sl.length;sl.forEach((x,k)=>x.classList.toggle('on',k===i));cap.textContent=p.feats[i];const g=$('.pg',v);const n=g.cloneNode();g.replaceWith(n)},3400)}
function insideRight(p,si){
  const bar=`<div class="mbar"><button data-imode="tela" aria-pressed="${imode==='tela'}">🖼 Telas</button><button data-imode="video" aria-pressed="${imode==='video'}">▶ Vídeo</button><button data-imode="sim" aria-pressed="${imode==='sim'}">⚡ Simulador</button></div>`;
  if(imode==='video')return bar+videoHTML(p)+`<p class="note" style="text-align:center">${p.video?'':'Cole o link do vídeo (YouTube, Vimeo ou arquivo MP4) no editor para trocar este exemplo.'}</p>`;
  if(imode==='sim')return bar+`<div class="simwrap"><div class="simhd"><span>⚡ Simulador · dados fictícios</span><button data-simreset>Reiniciar</button></div><div id="simbox">${(SIMS[p.id]||(()=>'<div class="empty" style="min-height:300px;color:var(--mute)">O simulador deste sistema ainda não foi criado.</div>'))()}</div></div>`;
  return bar+`<div class="bigf" id="bigf">${chrome}${sh(p,si)}</div><div class="sw2">${p.shots.map((x,k)=>`<button aria-pressed="${k===si}" data-shot="${k}" aria-label="Tela ${k+1}">${sh(p,k).replace('imgedit','').replace(/ data-img="[^"]*"/,'')}</button>`).join('')}</div>`;
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-imode]');if(m){imode=m.dataset.imode;render();return}
  const pl=e.target.closest('[data-play]');if(pl&&!edit){vidOn[pl.dataset.play]=true;render();return}
  if(e.target.closest('[data-simreset]')){simReset();renderSim();return}
  const sg=e.target.closest('[data-sim-go]');if(sg&&!edit){curP=S.projects.findIndex(x=>x.id===sg.dataset.simGo);imode='sim';render();document.getElementById('a-inside').scrollIntoView({behavior:'smooth'});return}
  const sb=e.target.closest('[data-sub]');if(sb&&!edit){const[id,k]=sb.dataset.sub.split(':');openCo(id,+k)}
});

 $('#co').innerHTML=`<form id="coform"><h3>Assinar ${esc(p.name)}</h3><div class="co-sum"><span style="color:#9aa3c7;font-size:13px">Plano ${esc(pl[0])} · ${yearly?'cobrança anual':'cobrança mensal'}</span><b>R$ ${tot}${yearly?'<small style="font:500 14px var(--body);color:#9aa3c7"> /ano</small>':'<small style="font:500 14px var(--body);color:#9aa3c7"> /mês</small>'}</b><span style="font-size:12.5px;color:#8790b8">Esta assinatura vale somente para ${esc(p.name)}. Os outros sistemas são contratados à parte.</span></div>
 <label class="fld">Nome ou empresa<input type="text" required placeholder="Ex.: Comércio Alfa Ltda"></label><label class="fld">E-mail<input type="text" required placeholder="voce@empresa.com.br"></label><label class="fld">CPF ou CNPJ<input type="text" placeholder="Somente números"></label>
 <div class="pay"><label><input type="radio" name="pg" checked><span>Pix</span></label><label><input type="radio" name="pg"><span>Cartão</span></label><label><input type="radio" name="pg"><span>Boleto</span></label></div>
 <div style="display:flex;gap:8px"><button class="ib go" style="flex:1;justify-content:center;padding:12px">Confirmar assinatura</button><button type="button" class="ib" id="cox">Fechar</button></div><p class="hint">Protótipo: nenhum pagamento é feito. No site real, esta etapa abre o checkout do gateway escolhido.</p></form>`;
 $('#co').classList.add('on');$('#cox').onclick=()=>$('#co').classList.remove('on');
 $('#coform').onsubmit=ev=>{ev.preventDefault();$('#co').innerHTML=`<div class="box"><h3>Assinatura registrada ✓</h3><p class="hint" style="font-size:14px">Pedido SS-${Math.floor(Math.random()*90000+10000)} · ${esc(p.name)} · plano ${esc(pl[0])}.<br>No site real você recebe por e-mail o acesso ao ${esc(p.name)}, com usuário e instruções.</p><button class="ib go" id="cox2" style="justify-content:center;padding:12px">Concluir</button></div>`;$('#cox2').onclick=()=>$('#co').classList.remove('on')}}

const cv=$('#bg'),cx=cv.getContext('2d');let W,H,pts=[],mx=0,my=0,sy=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=Array.from({length:Math.min(100,W/12|0)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,h:[350,45,155,200,250][Math.random()*5|0]}))}
rs();addEventListener('resize',rs);addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});addEventListener('scroll',()=>sy=scrollY,{passive:true});
(function f(t){cx.clearRect(0,0,W,H);const lt=S.theme.mode==='light';if(S.theme.motion||true)pts.forEach(p=>{const x=(p.x+mx*60*p.z+Math.sin(t/3000+p.y)*8*p.z+W*2)%W,y=((p.y-sy*.25*p.z+my*40*p.z+H*40)%H);cx.beginPath();cx.fillStyle=`hsla(${p.h},90%,${lt?55:72}%,${(.12+p.z*.45)*(lt?.7:1)})`;cx.arc(x,y,p.z*2.6,0,7);cx.fill()});requestAnimationFrame(f)})(0);

render();snap();
